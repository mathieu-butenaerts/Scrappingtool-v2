name: Tender Scrapers

on:
  schedule:
    - cron: '0 6,12 * * *'   # 06:00 en 12:00 UTC (zomertijd NL: 08:00 en 14:00)
  workflow_dispatch:

# Nooit twee runs tegelijk, anders vechten ze om tenders.db
concurrency:
  group: scrapers
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Dependencies installeren
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # tenders.db is >100 MB en past niet meer in git (GitHub weigert bestanden
      # boven 100 MB). De database reist tussen runs mee als asset van een vaste
      # release ("db-state"). Bestaat die nog niet, dan start de eerste run met de
      # tenders.db die in de repo staat (momentopname van 2026-11-11).
      - name: Database terughalen uit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view db-state >/dev/null 2>&1; then
            # release bestaat: een mislukte download mag NIET stil terugvallen op de
            # oude repo-versie, anders overschrijft deze run straks de goede kopie
            gh release download db-state --pattern tenders.db --clobber
            echo "tenders.db hersteld uit release db-state"
          else
            echo "Geen release db-state gevonden: start met tenders.db uit de repo"
          fi
          # wijzigingen aan dit bestand nooit in git laten belanden
          git update-index --skip-worktree tenders.db

      - name: Scrapers draaien
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MERCELL_EMAIL: ${{ secrets.MERCELL_EMAIL }}
          MERCELL_WACHTWOORD: ${{ secrets.MERCELL_WACHTWOORD }}
          STRIIVE_EMAIL: ${{ secrets.STRIIVE_EMAIL }}
          STRIIVE_WACHTWOORD: ${{ secrets.STRIIVE_WACHTWOORD }}
          MAGNIT_EMAIL: ${{ secrets.MAGNIT_EMAIL }}
          MAGNIT_WACHTWOORD: ${{ secrets.MAGNIT_WACHTWOORD }}
          FREELANCE_EMAIL: ${{ secrets.FREELANCE_EMAIL }}
          FREELANCE_WACHTWOORD: ${{ secrets.FREELANCE_WACHTWOORD }}
          STEDINVMS_EMAIL: ${{ secrets.STEDINVMS_EMAIL }}
          STEDINVMS_WACHTWOORD: ${{ secrets.STEDINVMS_WACHTWOORD }}
          PORTOFROTTERDAM_EMAIL: ${{ secrets.PORTOFROTTERDAM_EMAIL }}
          PORTOFROTTERDAM_WACHTWOORD: ${{ secrets.PORTOFROTTERDAM_WACHTWOORD }}
          NSVMS_EMAIL: ${{ secrets.NSVMS_EMAIL }}
          NSVMS_WACHTWOORD: ${{ secrets.NSVMS_WACHTWOORD }}
          ALLIANDERVMS_EMAIL: ${{ secrets.ALLIANDERVMS_EMAIL }}
          ALLIANDERVMS_WACHTWOORD: ${{ secrets.ALLIANDERVMS_WACHTWOORD }}
          STAFFINGMS_EMAIL: ${{ secrets.STAFFINGMS_EMAIL }}
          STAFFINGMS_WACHTWOORD: ${{ secrets.STAFFINGMS_WACHTWOORD }}
          HEART_EMAIL: ${{ secrets.HEART_EMAIL }}
          HEART_WACHTWOORD: ${{ secrets.HEART_WACHTWOORD }}
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERRIJKING_MODEL: ${{ vars.VERRIJKING_MODEL }}
          VERRIJKING_MAX_PER_RUN: ${{ vars.VERRIJKING_MAX_PER_RUN }}
        run: python run.py

      - name: CSV en debug uploaden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenders
          path: |
            tenders.csv
            tenders_nieuw.csv
            web/tenders.json
            debug_*.png
          if-no-files-found: ignore

      - name: Database bewaren in release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f tenders.db || { echo "geen tenders.db om te bewaren"; exit 0; }
          gh release view db-state >/dev/null 2>&1 || \
            gh release create db-state --title "Database-status (niet verwijderen)" \
              --notes "Wordt door de Tender Scrapers-workflow bij elke run overschreven. Bevat tenders.db."
          gh release upload db-state tenders.db --clobber

      - name: Dashboard-exports terugcommitten
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/samenvatting.json web/tenders_7d.json
          git diff --staged --quiet && echo "geen wijzigingen" && exit 0
          git commit -m "Tenders bijgewerkt $(date -u +%F)"
          git pull --rebase --autostash
          git push

      # --- Dashboard publiceren op GitHub Pages ---
      - name: Dashboard-data genereren
        if: always()
        run: python dashboard.py

      - name: Pages configureren
        if: always()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: web/ uploaden (dashboard + tenders.json)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deployen naar Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
