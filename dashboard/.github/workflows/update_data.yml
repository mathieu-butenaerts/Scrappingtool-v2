name: Update tenders data

on:
  schedule:
    # Draait elk uur op het hele uur (pas aan naar wens, bv. "0 */6 * * *" voor elke 6 uur)
    - cron: "0 * * * *"
  workflow_dispatch: {}   # laat je ook handmatig starten via de Actions-tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dashboard site (dashboard branch)
        uses: actions/checkout@v4
        with:
          ref: dashboard
          path: dashboard-site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: main
        run: |
          pip install -r requirements.txt

      - name: Run scrapers + export
        working-directory: main
        env:
          TENDERS_DB: tenders.db
          TENDERS_JSON_OUT: ${{ github.workspace }}/dashboard-site/data/tenders.json
        run: |
          python run.py

      - name: Commit en push naar dashboard branch als er wijzigingen zijn
        working-directory: dashboard-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          git diff --quiet --cached || git commit -m "Automatische data-update"
          git push
